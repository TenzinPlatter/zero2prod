services:
  postgres:
    image: postgres:16-alpine
    container_name: zero2prod_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: newsletter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d newsletter"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
